name: Quick Deploy to Device

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for this build'
        required: false
        default: 'latest'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Get commit info
      id: commit_info
      run: |
        echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "commit_msg=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_OUTPUT
        echo "build_time=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

    - name: Rename APK with build info
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk \
           app/build/outputs/apk/debug/StardewVoice-${{ steps.commit_info.outputs.build_time }}-${{ steps.commit_info.outputs.short_sha }}.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StardewVoice-${{ steps.commit_info.outputs.build_time }}
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create QR Code for download
      run: |
        echo "📱 **Quick Deploy Successful!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Info:**" >> $GITHUB_STEP_SUMMARY
        echo "- Time: ${{ steps.commit_info.outputs.build_time }}" >> $GITHUB_STEP_SUMMARY
        echo "- Commit: ${{ steps.commit_info.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- Message: ${{ steps.commit_info.outputs.commit_msg }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Download APK:**" >> $GITHUB_STEP_SUMMARY
        echo "Go to the 'Artifacts' section below to download the APK to your phone!" >> $GITHUB_STEP_SUMMARY
